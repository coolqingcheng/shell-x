name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试 (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 编译
        run: dotnet build ShellX.slnx -c Release
      - name: 运行测试
        shell: pwsh
        run: |
          # xunit v3 的测试宿主进程偶发崩溃（Test process did not return valid JSON），失败时自动重试
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet test ShellX.slnx -c Release --no-build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "测试失败（第 $attempt 次），10 秒后重试。"
            Start-Sleep -Seconds 10
          }
          exit 1

  # 与正式发布一致的 Native AOT 产物与安装包；测试暂不在 Unix runner 上运行，
  # Windows 专属的 DPAPI/凭据用例在 Linux/macOS 上会失败。
  package-unix:
    name: 打包 ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 安装打包依赖（Linux）
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y squashfs-tools
          # desktop-file-utils 只用于校验 desktop 文件，装不上也不影响打包。
          sudo apt-get install -y desktop-file-utils || echo "desktop-file-utils 安装失败，跳过校验。"
      - name: Native AOT 发布
        run: >
          dotnet publish src/ShellX.Desktop/ShellX.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishAot=true -p:PublishSingleFile=false
          -p:StripSymbols=true -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish/${{ matrix.rid }}
      - name: 统一产物名称
        shell: bash
        run: |
          mv "artifacts/publish/${{ matrix.rid }}/ShellX.Desktop" "artifacts/publish/${{ matrix.rid }}/ShellX"
          chmod +x "artifacts/publish/${{ matrix.rid }}/ShellX"
      - name: 打包 AppImage
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: bash scripts/build-appimage.sh "0.0.0-ci" "artifacts/publish/${{ matrix.rid }}" release-files
      - name: 打包 DMG
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: bash scripts/build-dmg.sh "0.0.0-ci" "artifacts/publish/${{ matrix.rid }}" release-files arm64
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ShellX-${{ matrix.rid }}
          path: |
            artifacts/publish/${{ matrix.rid }}/
            release-files/
          if-no-files-found: error
          retention-days: 14