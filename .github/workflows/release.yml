name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 确定版本号
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF -replace 'refs/tags/v', '' }
          else { $version = '${{ github.event.inputs.version }}' }
          if (-not $version) { throw '未指定版本号。' }
          "SHELLX_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "版本号：$version"

      - name: 编译 AOT 单文件
        shell: pwsh
        run: ./scripts/publish.ps1 -Aot -Version $env:SHELLX_VERSION

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 编译安装包
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:SHELLX_VERSION

      - name: 打包免安装版本
        shell: pwsh
        run: |
          $zip = "artifacts\installer\ShellX-$env:SHELLX_VERSION-win-x64.zip"
          Compress-Archive -Path 'artifacts\release\win-x64-aot\ShellX.exe' -DestinationPath $zip -Force

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            artifacts/installer/ShellX-Setup-*.exe
            artifacts/installer/ShellX-*-win-x64.zip
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 确定版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; else version="${{ github.event.inputs.version }}"; fi
          if [ -z "$version" ]; then echo '未指定版本号。' >&2; exit 1; fi
          echo "SHELLX_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本号：$version"

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools desktop-file-utils

      - name: Native AOT 发布
        run: >
          dotnet publish src/ShellX.Desktop/ShellX.Desktop.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishAot=true -p:PublishSingleFile=false
          -p:StripSymbols=true -p:DebugType=None -p:DebugSymbols=false
          -p:ShellXVersion=$SHELLX_VERSION
          -o artifacts/publish/linux-x64

      - name: 统一产物名称
        shell: bash
        run: |
          mv "artifacts/publish/linux-x64/ShellX.Desktop" "artifacts/publish/linux-x64/ShellX"
          chmod +x "artifacts/publish/linux-x64/ShellX"

      - name: 打包 AppImage
        shell: bash
        run: bash scripts/build-appimage.sh "$SHELLX_VERSION" artifacts/publish/linux-x64 release-files

      - name: 打包免安装版本
        shell: bash
        run: |
          tar -czf "release-files/ShellX-$SHELLX_VERSION-linux-x64.tar.gz" -C artifacts/publish/linux-x64 .

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-files/*
          if-no-files-found: error

  macos:
    name: macOS 磁盘映像 (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            suffix: arm64
          - os: macos-26-intel
            rid: osx-x64
            suffix: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 确定版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; else version="${{ github.event.inputs.version }}"; fi
          if [ -z "$version" ]; then echo '未指定版本号。' >&2; exit 1; fi
          echo "SHELLX_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本号：$version"

      - name: Native AOT 发布
        run: >
          dotnet publish src/ShellX.Desktop/ShellX.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishAot=true -p:PublishSingleFile=false
          -p:StripSymbols=true -p:DebugType=None -p:DebugSymbols=false
          -p:ShellXVersion=$SHELLX_VERSION
          -o artifacts/publish/${{ matrix.rid }}

      - name: 统一产物名称
        shell: bash
        run: |
          mv "artifacts/publish/${{ matrix.rid }}/ShellX.Desktop" "artifacts/publish/${{ matrix.rid }}/ShellX"
          chmod +x "artifacts/publish/${{ matrix.rid }}/ShellX"

      - name: 打包 DMG
        shell: bash
        run: bash scripts/build-dmg.sh "$SHELLX_VERSION" "artifacts/publish/${{ matrix.rid }}" release-files "${{ matrix.suffix }}"


      - name: 上传 ${{ matrix.rid }} 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: release-files/*
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: 生成本次更新内容
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            current="${GITHUB_REF#refs/tags/}"
          else
            version="${GITHUB_REF##*/}"
            current="v${version#v}"
          fi
          previous="$(git tag --list 'v*' --sort=-v:refname | awk -v current="$current" '
            { tags[NR] = $0 }
            $0 == current { found = NR }
            END { if (found > 0 && found < NR) print tags[found + 1] }')"
          {
            echo "## 更新内容"
            echo
            notes=""
            if [[ -n "$previous" ]]; then
              notes="$(git log --no-merges --pretty=format:'- %s' "$previous..HEAD")"
            fi
            if [[ -z "$notes" ]]; then
              notes="$(git log -20 --no-merges --pretty=format:'- %s' HEAD)"
            fi
            printf '%s\n' "$notes"
            echo
            echo
            if [[ -n "$previous" ]]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$current"
            else
              echo "**Release**: https://github.com/$GITHUB_REPOSITORY/releases/tag/$current"
            fi
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: 列出待发布文件
        run: ls -lh release-files

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-notes.md
          draft: false